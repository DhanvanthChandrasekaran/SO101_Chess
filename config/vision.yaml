# Board warp and occupancy tuning
px_per_square: 50         # top-down image is 8*this px square
patch_frac: 0.4           # sampled patch side / square side
threshold: 50.0  # user choice within the 30-60 working range found with the tools/vision_live.py slider (2026-10-31)

# Lens calibration (calibration/camera_intrinsics.py)
lens_model: fisheye       # 106 deg diagonal FOV; pinhole is the fallback
checkerboard:
  inner_corners: [9, 6]        # [columns, rows] of inner corners; --make-checkerboard draws this size
  square_mm: 21.428
  capture:                     # camera_intrinsics.py --capture (starting values; tune if it saves too often or never)
    still_px: 10               # board corners may move at most this much between frames to count as "held still" (full-size px). Bigger = saves sooner, more blur risk
    min_change_frac: 0.03      # new spot if the board corners are this far from every saved photo's (fraction of the image diagonal, ~100 px). Smaller = saves more often
    min_size_change_frac: 0.10 # ...or if the board looks this much bigger/smaller (0.10 = 10%), i.e. moved nearer or farther. Smaller = saves more often
    target_photos: 25          # stop after this many
