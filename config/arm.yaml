# Arm geometry, tool pose, motion and safety. Lengths m, angles deg (see docs/INTERFACES.md §2.7-2.9).

# Kinematics: lerobot RobotKinematics (placo) on the SO101 URDF
urdf_path: control/urdf/so101_new_calib.urdf  # copy of SO-ARM100 Simulation/SO101 (commit a758567), relative to the repo root
target_frame: gripper_frame_link
tcp_offset_m: [-0.008, 0.0, 0.004]  # TODO check with a ruler. target_frame -> TCP (centre of a gripped piece at the jaw tips), target_frame axes:
                           # +z out of the jaws, moving jaw on -x. Proposed from the URDF meshes (frame sits at the fixed jaw tip)
ik_orientation_weight: 0.1 # TODO tune; position weight is 1.0
ik_max_iters: 50
ik_pos_tol_m: 0.002        # FK check after IK; worse -> unreachable
ik_pitch_tol_deg: 3.0
joint_limits_deg:          # TODO: read from teleop; arm.send clamps, ik rejects. null = only the URDF limit applies
  shoulder_pan: [null, null]
  shoulder_lift: [null, null]
  elbow_flex: [null, null]
  wrist_flex: [null, null]
  wrist_roll: [null, null]

# Tool pose: pitch from horizontal (+ = down), linear in horizontal reach
pitch_near_deg: null       # TODO tune on bench (near base: ~steep)
pitch_far_deg: null        # TODO tune on bench (far edge: shallower)
reach_near_m: null         # TODO
reach_far_m: null          # TODO
wrist_roll_deg: null       # TODO fixed roll so jaws open sideways

# Heights above board surface (TCP z)
hover_height_m: 0.07       # above the piece top before descending
travel_height_m: null      # TODO must clear a king while carrying a king (> ~0.09)
grip_height_frac: 0.7      # fraction of piece height to grip at
place_drop_m: 0.003        # release this far above contact
min_z_m: 0.005             # never command TCP lower than this
workspace_margin_m: 0.02   # allowed beyond the playing area edge

# Gripper (lerobot 0-100). Close past the piece; torque limit sets squeeze force.
gripper_open: null         # TODO
gripper_close: null        # TODO (fully closed is fine)
gripper_torque: 300        # TODO Max_Torque_Limit 0-1000 (lerobot default 500)
gripper_wait_s: 0.4

# calibration/arm_board.py (hand-guided, torque off)
calibration_sample_s: 0.5      # average the joint readings over this long when you press Enter
calibration_max_error_m: 0.005 # TODO confirm; warn if a touched square is further than this from the fitted board

# Speed
max_speed_scale: 0.3       # keep low until tuned
max_joint_speed_deg_s: null  # TODO
control_hz: 50
settle_tol_deg: 2.0
step_timeout_s: 5.0

# Used ONLY with --mock when calibration/data/ is missing
nominal:
  board_origin_base_m: [null, null, 0.0]  # TODO a1 outer corner in base frame (~5 cm gap + border); board +x = base -y
  park_pose_deg: null      # TODO {shoulder_pan: .., ..., gripper: ..} all 6 joints
