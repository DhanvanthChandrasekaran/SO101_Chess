# Camera and arm connection
camera:
  device: /dev/v4l/by-id/usb-Xitech_USB_Camera_20250606105-video-index0  # IMX335; stable across reboots (was /dev/video3)
  width: 2592             # full sensor 4:3, full FOV, ~20 fps measured. 1920x1080 is a CROP (cuts top/bottom)
  height: 1944
  fourcc: MJPG
  flush_frames: 3         # stale frames dropped per grab
  exposure: 1080  # set by calibration/camera_exposure.py
  white_balance: 4610  # set by calibration/camera_exposure.py
arm:
  port: /dev/ttyACM0      # follower
  id: HAM_follower_001    # lerobot calibration id
